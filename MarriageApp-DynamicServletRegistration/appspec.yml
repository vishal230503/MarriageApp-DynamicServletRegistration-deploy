version: 0.0
os: linux
files:
  - source: /MarriageApp.war
    destination: /opt/deploy
    overwrite: true
hooks:
  ApplicationStop:
    - location: scripts/stop_tomcat.sh
      timeout: 120
      runas: root
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/deploy_war.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start_tomcat.sh
      timeout: 180
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 180
      runas: root
